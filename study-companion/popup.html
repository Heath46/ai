<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles/popup.css"><title>Study Companion</title></head><body><main><header><span class="logo">S</span><div><h1>学习伴侣</h1><p>只辅助学习，不代替学习。</p></div></header><nav><button class="tab active" data-panel="notes">笔记</button><button class="tab" data-panel="focus">专注</button><button class="tab" data-panel="cards">复习卡</button><button class="tab" data-panel="access">阅读</button></nav><section id="notes" class="panel active"><label for="note">当前页面笔记</label><textarea id="note" placeholder="写下概念、疑问或下一步…"></textarea><div class="row"><button id="save-note" class="primary">保存笔记</button><button id="copy-page-title">复制标题</button></div><p id="note-status" class="status" aria-live="polite"></p></section><section id="focus" class="panel"><p class="timer" id="timer">25:00</p><label for="minutes">时长（分钟）</label><input id="minutes" type="number" min="1" max="120" value="25"><div class="row"><button id="start-focus" class="primary">开始专注</button><button id="stop-focus">结束</button></div><p class="hint">结束时显示提醒；不会操控课程页面。</p></section><section id="cards" class="panel"><label for="question">问题</label><input id="question" placeholder="例如：什么是机会成本？"><label for="answer">答案</label><textarea id="answer" placeholder="用自己的话回答…"></textarea><button id="add-card" class="primary">加入复习卡</button><div id="card-area" class="card-area"></div></section><section id="access" class="panel"><label for="font-size">页面字号 <output id="font-size-value">100%</output></label><input id="font-size" type="range" min="85" max="160" value="100"><label class="check"><input id="high-contrast" type="checkbox"> 高对比度阅读</label><button id="apply-access" class="primary">应用到当前页面</button></section></main><script type="module" src="scripts/popup.js"></script></body></html>
